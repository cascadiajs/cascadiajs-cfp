name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile is written by npm 11 (packageManager); Node 22 ships npm 10, whose
      # npm ci rejects it over an unmet optional peer dependency.
      - name: Use npm 11
        run: npm install -g npm@11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run build
