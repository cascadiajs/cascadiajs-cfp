[build]
  # Type-checks the functions; Netlify bundles them itself. A type error fails the deploy.
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Match packageManager in package.json: the lockfile is written by npm 11.
  NPM_VERSION = "11.7.0"

[functions]
  node_bundler = "esbuild"
